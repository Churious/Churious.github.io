<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">공마고의 도둑들 시스템 구성도</title>
  <desc id="desc">아두이노 UNO와 초음파 센서가 ESP32-CAM을 작동시키고, 사진이 AWS EC2 업로드 서버를 거쳐 S3에 저장되며 Vercel 웹 화면에서 확인되는 구조</desc>
  <defs>
    <linearGradient id="cloud" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f1f7ff"/><stop offset="1" stop-color="#dcecff"/></linearGradient>
    <linearGradient id="device" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#232323"/><stop offset="1" stop-color="#101010"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#191919"/></marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f6f6f6"/></marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#191919}.eyebrow{font:600 12px Arial,sans-serif;letter-spacing:2px;fill:#666}.label{font:700 18px Arial,sans-serif;fill:#191919}.small{font:400 14px Arial,sans-serif;fill:#555}.tiny{font:600 12px Arial,sans-serif;fill:#666;letter-spacing:1px}.card{fill:#fff;stroke:#d0d0d0;stroke-width:2}.dark{fill:url(#device);stroke:#303030;stroke-width:2}.darkLabel{fill:#fff}.line{stroke:#191919;stroke-width:3;fill:none;marker-end:url(#arrow)}.lineLight{stroke:#f6f6f6;stroke-width:3;fill:none;marker-end:url(#arrowLight)}.accent{fill:#d8ff3e}.accentLine{stroke:#d8ff3e;stroke-width:3;fill:none}.cloudLabel{font:700 16px Arial,sans-serif;fill:#31628d}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fafafa"/>
  <text x="60" y="65" class="eyebrow">GJSMT THIEVES / SYSTEM ARCHITECTURE</text>
  <text x="60" y="108" class="title">문이 열리면, 기록이 시작됩니다.</text>

  <rect x="48" y="150" width="420" height="510" rx="20" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2"/>
  <text x="80" y="194" class="eyebrow">HARDWARE</text>
  <rect x="80" y="225" width="165" height="170" rx="16" class="dark"/>
  <circle cx="163" cy="290" r="33" fill="none" stroke="#d8ff3e" stroke-width="4"/><circle cx="163" cy="290" r="8" class="accent"/>
  <path d="M124 350h78M124 366h78" stroke="#d8ff3e" stroke-width="4"/>
  <text x="106" y="430" class="label">ESP32-CAM</text><text x="107" y="453" class="small">촬영 · Wi-Fi · HTTP 업로드</text>
  <rect x="275" y="225" width="155" height="170" rx="16" class="card"/>
  <rect x="310" y="270" width="85" height="55" rx="5" fill="#191919"/><path d="M332 270v-25M373 270v-25M332 325v25M373 325v25M310 286h-22M310 310h-22M395 286h22M395 310h22" stroke="#191919" stroke-width="5"/>
  <text x="304" y="365" class="label">Arduino UNO</text><text x="303" y="388" class="small">센서 · 경보 · 트리거</text>
  <rect x="80" y="485" width="350" height="112" rx="14" fill="#fff" stroke="#d0d0d0" stroke-width="2"/>
  <text x="105" y="520" class="tiny">INPUT / OUTPUT</text><text x="105" y="550" class="small">초음파 센서 → 문 열림 감지</text><text x="105" y="576" class="small">RGB LED · 부저 → 경고 상태 표시</text>

  <rect x="510" y="150" width="642" height="510" rx="20" fill="url(#cloud)" stroke="#9dbbd8" stroke-width="2"/>
  <text x="545" y="194" class="cloudLabel">AWS CLOUD</text>
  <rect x="550" y="245" width="230" height="170" rx="16" class="dark"/>
  <circle cx="665" cy="320" r="38" fill="none" stroke="#fff" stroke-width="3"/><path d="M632 320h66M665 287v66" stroke="#fff" stroke-width="3"/>
  <text x="610" y="455" class="label">EC2 BROKER</text><text x="601" y="478" class="small">사진 수신 · S3 저장</text>
  <rect x="865" y="245" width="230" height="170" rx="16" class="card"/>
  <path d="M930 290c0-14 18-24 42-24s42 10 42 24v75c0 14-18 24-42 24s-42-10-42-24Z" fill="#86b817"/><ellipse cx="972" cy="290" rx="42" ry="12" fill="#a9d93a"/><path d="M930 290c0 14 18 24 42 24s42-10 42-24M930 328c0 14 18 24 42 24s42-10 42-24" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="929" y="455" class="label">S3 BUCKET</text><text x="912" y="478" class="small">JPEG 이미지 저장</text>
  <rect x="550" y="525" width="545" height="76" rx="14" fill="#fff" stroke="#9dbbd8" stroke-width="2"/>
  <text x="580" y="556" class="tiny">INFRASTRUCTURE AS CODE</text><text x="580" y="581" class="small">Terraform · VPC · Lambda · API Gateway</text>

  <rect x="80" y="680" width="1040" height="1" fill="#d0d0d0"/>
  <path d="M430 310h105" class="line"/><text x="456" y="295" class="tiny">TRIGGER</text>
  <path d="M780 330h75" class="line"/><text x="790" y="315" class="tiny">UPLOAD</text>
  <path d="M780 370h75" class="lineLight" opacity="0"/>
  <rect x="550" y="635" width="230" height="64" rx="14" fill="#191919"/><text x="585" y="662" class="darkLabel tiny">WEB VIEWER</text><text x="585" y="684" class="darkLabel small">Vercel · JavaScript</text>
  <path d="M980 415v185H780" class="line"/><text x="995" y="535" class="tiny" transform="rotate(90 995 535)">READ</text>
  <path d="M665 525v-92" class="line"/><text x="680" y="500" class="tiny">STORE</text>
</svg>
