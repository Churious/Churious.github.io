<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">공마고의 도둑들 Terraform AWS 아키텍처</title>
  <desc id="desc">Arduino UNO가 ESP32-CAM을 트리거하고, ESP32-CAM이 API Gateway의 POST upload를 호출합니다. API Gateway는 Lambda를 호출해 S3 presigned URL을 발급하고, ESP32-CAM은 그 URL로 S3에 이미지를 업로드합니다. Vercel JavaScript 웹 화면이 저장된 이미지를 확인합니다.</desc>
  <defs>
    <linearGradient id="aws" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eef6ff"/><stop offset="1" stop-color="#dcecff"/></linearGradient>
    <linearGradient id="device" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#262626"/><stop offset="1" stop-color="#111"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#191919"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#3a73a9"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#191919}.eyebrow{font:600 12px Arial,sans-serif;letter-spacing:2px;fill:#666}.label{font:700 18px Arial,sans-serif;fill:#191919}.small{font:400 14px Arial,sans-serif;fill:#555}.tiny{font:600 12px Arial,sans-serif;fill:#666;letter-spacing:1px}.card{fill:#fff;stroke:#cfcfcf;stroke-width:2}.dark{fill:url(#device);stroke:#303030;stroke-width:2}.darkLabel{fill:#fff}.line{stroke:#191919;stroke-width:3;fill:none;marker-end:url(#arrow)}.blueLine{stroke:#3a73a9;stroke-width:3;fill:none;marker-end:url(#arrowBlue)}.dashed{stroke:#7fa4c7;stroke-width:2;stroke-dasharray:8 8;fill:none}.accent{fill:#d8ff3e}.cloudLabel{font:700 18px Arial,sans-serif;fill:#31628d}
    </style>
  </defs>
  <rect width="1400" height="820" fill="#fafafa"/>
  <text x="60" y="62" class="eyebrow">GJSMT THIEVES / TERRAFORM ARCHITECTURE</text>
  <text x="60" y="110" class="title">한 장의 사진을 안전하게 저장하는 흐름.</text>

  <rect x="50" y="155" width="400" height="575" rx="22" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2"/>
  <text x="82" y="200" class="eyebrow">HARDWARE</text>
  <rect x="82" y="240" width="155" height="145" rx="16" class="card"/>
  <rect x="119" y="276" width="82" height="50" rx="5" fill="#191919"/><path d="M138 276v-22M181 276v-22M138 326v22M181 326v22M119 291H97M119 312H97M201 291h22M201 312h22" stroke="#191919" stroke-width="5"/>
  <text x="112" y="370" class="label">Arduino UNO</text><text x="100" y="410" class="small">초음파 센서 · LED · 부저</text>
  <rect x="268" y="240" width="150" height="145" rx="16" class="dark"/>
  <circle cx="343" cy="298" r="31" fill="none" stroke="#d8ff3e" stroke-width="4"/><circle cx="343" cy="298" r="7" class="accent"/><path d="M309 350h68" stroke="#d8ff3e" stroke-width="4"/>
  <text x="299" y="370" class="darkLabel label">ESP32-CAM</text><text x="286" y="410" class="small">사진 촬영 · Wi-Fi</text>
  <rect x="82" y="470" width="336" height="170" rx="16" class="card"/>
  <text x="108" y="510" class="tiny">DEVICE HANDSHAKE</text><text x="108" y="545" class="small">문 열림 → TRIGGER</text><text x="108" y="575" class="small">촬영 완료 → COMPLETE</text><text x="108" y="605" class="small">준비 상태 → READY</text>

  <rect x="500" y="155" width="850" height="575" rx="22" fill="url(#aws)" stroke="#9dbbd8" stroke-width="2"/>
  <text x="535" y="200" class="cloudLabel">AWS CLOUD · ap-northeast-2</text>
  <rect x="540" y="240" width="245" height="155" rx="16" class="card"/>
  <rect x="580" y="275" width="165" height="55" rx="8" fill="#ff9d37"/><text x="608" y="309" class="label">API Gateway</text><text x="583" y="365" class="small">POST /upload</text>
  <rect x="865" y="240" width="205" height="155" rx="16" class="dark"/>
  <path d="M908 300c0-18 25-32 55-32s55 14 55 32" fill="none" stroke="#d8ff3e" stroke-width="4"/><path d="M908 300v35c0 18 25 32 55 32s55-14 55-32v-35" fill="none" stroke="#d8ff3e" stroke-width="4"/><path d="M934 302l29 16 29-16" fill="none" stroke="#d8ff3e" stroke-width="4"/>
  <text x="915" y="395" class="darkLabel label">Lambda</text><text x="900" y="420" class="small">Presigned URL 발급</text>
  <rect x="1140" y="240" width="160" height="155" rx="16" class="card"/>
  <path d="M1174 290c0-12 18-21 45-21s45 9 45 21v66c0 12-18 21-45 21s-45-9-45-21Z" fill="#86b817"/><ellipse cx="1219" cy="290" rx="45" ry="11" fill="#addb45"/><path d="M1174 290c0 13 18 23 45 23s45-10 45-23M1174 324c0 13 18 23 45 23s45-10 45-23" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="1170" y="395" class="label">S3</text><text x="1156" y="420" class="small">이미지 저장</text>
  <rect x="540" y="485" width="760" height="155" rx="16" fill="#fff" stroke="#9dbbd8" stroke-width="2"/>
  <text x="570" y="525" class="tiny">TERRAFORM MANAGED RESOURCES</text><text x="570" y="563" class="small">VPC · 2 Public Subnets · S3 Bucket · Lambda IAM Role</text><text x="570" y="598" class="small">API Gateway REST API · /upload · prod stage</text>

  <path d="M418 300h115" class="line"/><text x="442" y="282" class="tiny">UPLOAD REQUEST</text>
  <path d="M785 315h70" class="line"/><text x="795" y="295" class="tiny">INVOKE</text>
  <path d="M1070 315h55" class="line"/><text x="1080" y="295" class="tiny">PUT</text>
  <path d="M865 395v84" class="blueLine"/><text x="880" y="450" class="tiny">URL</text>
  <path d="M1140 415v75H790" class="blueLine"/><text x="990" y="475" class="tiny">DIRECT UPLOAD</text>
  <rect x="720" y="665" width="280" height="58" rx="14" fill="#191919"/><text x="752" y="690" class="darkLabel tiny">WEB VIEWER</text><text x="752" y="711" class="darkLabel small">Vercel · JavaScript</text>
  <path d="M1000 694h145v-299" class="blueLine"/><text x="1158" y="570" class="tiny" transform="rotate(90 1158 570)">READ / VIEW</text>
</svg>
