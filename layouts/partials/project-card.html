<a class="project-card" href="{{ .RelPermalink }}">
  <div class="project-poster" aria-hidden="true"><span class="poster-meta">CHURIOUS EXPERIMENT{{ with .Params.year }} / {{ . }}{{ end }}</span><span class="poster-title">{{ .Params.posterTitle | safeHTML }}</span><span class="poster-bottom">{{ .Params.posterLabel | default "PROJECT" }} <span>↗</span></span></div>
  <div class="project-info"><p class="eyebrow">{{ delimit .Params.tags " / " }}</p><h3>{{ .Title }}</h3><p>{{ .Description }}</p><span class="project-cta">프로젝트 살펴보기 <span aria-hidden="true">↗</span></span></div>
</a>
