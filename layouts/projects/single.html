{{ define "main" }}
<main id="main" class="container project-page">
  <a class="text-link back-link" href="/projects/">← 모든 프로젝트</a>
  <header class="project-heading"><p class="eyebrow">{{ delimit .Params.tags " / " }} · {{ .Date.Format "2006" }}</p><h1>{{ .Title }}</h1><p>{{ .Description }}</p></header>
  <div class="project-body"><aside><p class="eyebrow">PROJECT INFO</p><ul><li>{{ .Date.Format "2006" }}</li>{{ range .Params.tags }}<li>{{ . }}</li>{{ end }}</ul></aside><article>{{ .Content }}</article></div>
  <a class="text-link" href="/projects/">다른 프로젝트 둘러보기 ↗</a>
</main>
{{ end }}
